<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>relay2rate</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #eceff5;
      --bg-grad-a: #e8ecf6;
      --bg-grad-b: #f4f6fa;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #171c26;
      --muted: #69758a;
      --line: #e2e7f0;
      --line-strong: #ccd4e2;
      --shadow: 0 1px 3px rgba(23, 28, 38, .06), 0 10px 24px -12px rgba(23, 28, 38, .10);
      --shadow-hover: 0 2px 6px rgba(23, 28, 38, .08), 0 16px 40px -14px rgba(23, 28, 38, .16);
      --accent: #4f46e5;
      --accent-strong: #4338ca;
      --accent-soft: rgba(79, 70, 229, .10);
      --accent-ring: rgba(79, 70, 229, .22);
      --green: #0f8a5f;
      --green-bg: #e6f6ef;
      --red: #d33b31;
      --red-bg: #fdecea;
      --amber: #a16107;
      --amber-bg: #fdf3dd;
      --blue: #1769b4;
      --blue-bg: #e7f1fb;
      --input-bg: #ffffff;
      --radius: 14px;
      --radius-sm: 9px;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #0c0f15;
      --bg-grad-a: #0e1220;
      --bg-grad-b: #0c0f15;
      --panel: #161b25;
      --panel-2: #1b2230;
      --text: #e8edf5;
      --muted: #8e99ac;
      --line: #273041;
      --line-strong: #354055;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px -8px rgba(0, 0, 0, .45);
      --shadow-hover: 0 2px 5px rgba(0, 0, 0, .35), 0 14px 32px -10px rgba(0, 0, 0, .55);
      --accent: #818cf8;
      --accent-strong: #a5b0fc;
      --accent-soft: rgba(129, 140, 248, .14);
      --accent-ring: rgba(129, 140, 248, .3);
      --green: #47c78f;
      --green-bg: rgba(71, 199, 143, .14);
      --red: #f27066;
      --red-bg: rgba(242, 112, 102, .14);
      --amber: #e8b34b;
      --amber-bg: rgba(232, 179, 75, .13);
      --blue: #6aaae6;
      --blue-bg: rgba(106, 170, 230, .15);
      --input-bg: #12161f;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #0c0f15;
        --bg-grad-a: #0e1220;
        --bg-grad-b: #0c0f15;
        --panel: #161b25;
        --panel-2: #1b2230;
        --text: #e8edf5;
        --muted: #8e99ac;
        --line: #273041;
        --line-strong: #354055;
        --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 6px 18px -8px rgba(0, 0, 0, .45);
        --shadow-hover: 0 2px 5px rgba(0, 0, 0, .35), 0 14px 32px -10px rgba(0, 0, 0, .55);
        --accent: #818cf8;
        --accent-strong: #a5b0fc;
        --accent-soft: rgba(129, 140, 248, .14);
        --accent-ring: rgba(129, 140, 248, .3);
        --green: #47c78f;
        --green-bg: rgba(71, 199, 143, .14);
        --red: #f27066;
        --red-bg: rgba(242, 112, 102, .14);
        --amber: #e8b34b;
        --amber-bg: rgba(232, 179, 75, .13);
        --blue: #6aaae6;
        --blue-bg: rgba(106, 170, 230, .15);
        --input-bg: #12161f;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, var(--bg-grad-a), var(--bg-grad-b) 240px) no-repeat, var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Header ─────────────────────────────── */
    header {
      flex-shrink: 0;
      padding: 14px 24px 12px;
      background: color-mix(in srgb, var(--panel) 78%, transparent);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 14px; max-width: 1560px; margin: 0 auto; }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .logo {
      width: 30px; height: 30px; border-radius: 9px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 55%, #06b6d4));
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-weight: 800; font-size: 15px;
      box-shadow: 0 4px 10px -3px var(--accent-ring);
    }
    h1 { margin: 0; font-size: 19px; letter-spacing: .2px; }
    .tag {
      font-size: 11px; font-weight: 700; color: var(--accent);
      background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; white-space: nowrap;
    }
    .meta {
      margin-top: 5px; color: var(--muted); font-size: 12.5px;
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    }
    .meta .running {
      color: var(--accent); font-weight: 650;
      display: inline-flex; align-items: center; gap: 6px;
    }
    .meta .running::before {
      content: ""; width: 6px; height: 6px; border-radius: 999px;
      background: var(--accent); animation: pulse 1.2s ease-in-out infinite;
    }
    .actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

    /* ── Controls ───────────────────────────── */
    button, select, input {
      height: 34px; border: 1px solid var(--line); border-radius: var(--radius-sm);
      background: var(--input-bg); color: var(--text); font-size: 13.5px;
      font-family: inherit; transition: border-color .14s, box-shadow .14s, background .14s, color .14s, transform .06s;
    }
    button { padding: 0 13px; font-weight: 650; cursor: pointer; white-space: nowrap; }
    button:hover:not(:disabled) { border-color: var(--line-strong); background: var(--panel-2); }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-ring);
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.primary:hover:not(:disabled) { background: var(--accent-strong); border-color: var(--accent-strong); }
    button:disabled { cursor: not-allowed; opacity: .55; }
    button.icon-btn { width: 34px; padding: 0; font-size: 15px; }
    button.is-loading {
      display: inline-flex; align-items: center; justify-content: center; gap: 7px;
      cursor: wait; opacity: 1;
    }
    button.is-loading::before, .spinner {
      content: ""; width: 12px; height: 12px; flex-shrink: 0;
      border: 2px solid currentColor; border-right-color: transparent;
      border-radius: 999px; animation: spin .7s linear infinite;
    }
    input, select { padding: 0 10px; font-variant-numeric: tabular-nums; }
    input::placeholder { color: var(--muted); }

    main {
      flex: 1 1 auto; min-height: 0; max-width: 1560px; width: 100%;
      margin: 0 auto; padding: 14px 24px 24px;
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ── Toolbar ────────────────────────────── */
    .toolbar {
      display: grid; grid-template-columns: minmax(200px, 1fr) auto auto; gap: 8px;
      align-items: center; margin-bottom: 10px; flex-shrink: 0;
    }
    .summary { justify-self: end; color: var(--muted); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    /* ── Login confirm bar ──────────────────── */
    .login-bar { display: none; flex-direction: column; gap: 8px; margin: 0 0 10px; flex-shrink: 0; }
    .login-bar.show { display: flex; }
    .login-chip {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 10px 12px; border-radius: var(--radius-sm);
      border: 1px solid color-mix(in srgb, var(--amber) 40%, var(--line));
      background: var(--amber-bg); color: var(--text);
      animation: dropIn .18s ease;
    }
    .login-chip-text { flex: 1; font-size: 13px; line-height: 1.5; }
    .login-chip button { flex-shrink: 0; }

    /* ── Channel chips ──────────────────────── */
    .channel-bar {
      display: flex; flex-wrap: wrap; gap: 7px; margin: 0 0 12px; flex-shrink: 0;
    }
    .channel-chip {
      display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px;
      border: 1px solid var(--line); border-radius: 999px;
      background: var(--panel); color: var(--muted);
      font-size: 12.5px; font-weight: 650; cursor: grab; user-select: none;
      transition: color .12s, border-color .12s, background .12s, opacity .12s;
      box-shadow: var(--shadow);
    }
    .channel-chip:hover { border-color: var(--line-strong); }
    .channel-chip.dragging { opacity: .4; cursor: grabbing; }
    .channel-chip .dot { width: 8px; height: 8px; border-radius: 999px; background: hsl(var(--h, 220) 70% 55%); flex-shrink: 0; }
    .channel-chip input { width: 13px; height: 13px; margin: 0; accent-color: var(--accent); cursor: pointer; }
    .channel-chip.active {
      color: var(--text); border-color: color-mix(in srgb, hsl(var(--h, 220) 70% 55%) 55%, var(--line));
      background: color-mix(in srgb, hsl(var(--h, 220) 75% 55%) 12%, var(--panel));
    }

    /* ── Cards grid ─────────────────────────── */
    #content { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 2px 2px 20px; scrollbar-width: thin; }
    .columns {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 18px;
      align-items: start;
    }
    .column {
      background: var(--panel); border: 0; border-radius: 16px;
      overflow: hidden; position: relative;
      box-shadow: 0 1px 2px color-mix(in srgb, hsl(var(--h, 220) 45% 40%) 12%, transparent),
                  0 10px 26px -14px color-mix(in srgb, hsl(var(--h, 220) 45% 40%) 28%, transparent);
      transition: transform .16s, box-shadow .16s;
    }
    .column:hover {
      transform: translateY(-2px);
      box-shadow: 0 2px 4px color-mix(in srgb, hsl(var(--h, 220) 45% 40%) 14%, transparent),
                  0 18px 44px -16px color-mix(in srgb, hsl(var(--h, 220) 45% 40%) 36%, transparent);
    }
    .column .topline {
      position: absolute; inset: 0 0 auto 0; height: 4px;
      background: hsl(var(--h, 220) 70% 55%);
      background: linear-gradient(90deg, hsl(var(--h, 220) 72% 56%), hsl(var(--h, 220) 72% 62%));
      opacity: .9;
    }
    .column.is-refreshing { }
    .column.is-refreshing::before {
      content: ""; position: absolute; inset: 4px 0 auto; height: 3px; z-index: 2;
      background: linear-gradient(90deg, transparent, hsl(var(--h, 220) 80% 60%), transparent);
      background-size: 180% 100%; animation: refreshBar 1s linear infinite;
    }
    .column.is-refreshing .column-head { background: color-mix(in srgb, hsl(var(--h, 220) 75% 55%) 10%, var(--panel)); }

    .column-head {
      padding: 18px 17px 12px; border-bottom: 0;
      background: linear-gradient(180deg,
        color-mix(in srgb, hsl(var(--h, 220) 75% 55%) 9%, var(--panel)),
        color-mix(in srgb, hsl(var(--h, 220) 75% 55%) 3%, var(--panel)));
      transition: background .16s;
    }
    .column-title { display: flex; align-items: center; gap: 8px; }
    .column-title .dot { width: 9px; height: 9px; border-radius: 999px; background: hsl(var(--h, 220) 70% 55%); flex-shrink: 0; }
    .column-name { font-size: 15px; font-weight: 750; overflow-wrap: anywhere; min-width: 0; }
    .column-refresh {
      margin-left: auto; height: 27px; padding: 0 10px; font-size: 12px; font-weight: 650;
      flex-shrink: 0; border-radius: 7px; color: var(--accent);
      border-color: color-mix(in srgb, var(--accent) 35%, var(--line));
      background: var(--panel);
    }
    .column-refresh:hover:not(:disabled) { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-strong); }
    .column-refresh.is-loading { min-width: 74px; color: var(--muted); pointer-events: none; }
    .column-sub {
      color: var(--muted); font-size: 12px; margin-top: 4px; overflow-wrap: anywhere;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .column-stats {
      display: flex; align-items: center; gap: 5px; margin-top: 8px;
      color: var(--muted); font-size: 12px; flex-wrap: wrap; font-variant-numeric: tabular-nums;
    }
    .column-stats > span + span::before { content: "·"; margin-right: 5px; color: var(--line-strong); }
    .elapsed { color: var(--accent); font-weight: 700; }
    .balance { color: var(--green); font-weight: 750; }
    .balance.low { color: var(--amber); }
    .balance.none { color: var(--red); }

    .pill {
      display: inline-flex; align-items: center; min-height: 20px; padding: 1px 8px;
      border-radius: 999px; font-size: 11px; font-weight: 750; white-space: nowrap;
      background: var(--green-bg); color: var(--green);
    }
    .pill.error { background: var(--red-bg); color: var(--red); }
    .pill.busy { background: var(--accent-soft); color: var(--accent); }

    /* ── Groups ─────────────────────────────── */
    .group-list { display: flex; flex-direction: column; padding: 4px 0; }
    .group-item {
      display: flex; align-items: flex-start; gap: 10px; padding: 8px 17px;
      border-bottom: 0; position: relative; transition: background .12s;
      border-top: 1px solid color-mix(in srgb, var(--line) 65%, transparent);
    }
    .group-item:first-child { border-top: 0; }
    .group-item:hover { background: color-mix(in srgb, var(--panel-2) 78%, transparent); }
    .group-info { flex: 1; min-width: 0; }
    .group-name { font-weight: 650; font-size: 13.5px; overflow-wrap: anywhere; }
    .desc { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
    .group-side { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; flex-shrink: 0; }
    .group-conc { color: var(--muted); font-size: 11.5px; white-space: nowrap; font-variant-numeric: tabular-nums; }

    .multiplier {
      display: inline-flex; justify-content: center; min-width: 54px; padding: 2.5px 8px;
      border-radius: 7px; font-weight: 800; font-size: 12.5px; font-variant-numeric: tabular-nums;
      background: var(--green-bg); color: var(--green);
    }
    .multiplier.warn { background: var(--amber-bg); color: var(--amber); }
    .multiplier.high { background: var(--red-bg); color: var(--red); }
    .multiplier.best {
      background: linear-gradient(135deg, var(--accent), color-mix(in srgb, var(--accent) 60%, #06b6d4));
      color: #fff; box-shadow: 0 2px 8px -2px var(--accent-ring);
    }
    .mult-wrap { display: inline-flex; align-items: center; gap: 4px; }
    .mult-delta {
      font-size: 10.5px; font-weight: 750; padding: 1px 5px; border-radius: 5px;
      white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .mult-delta.up { background: var(--red-bg); color: var(--red); }
    .mult-delta.down { background: var(--green-bg); color: var(--green); }
    .mult-delta.new-group { background: var(--blue-bg); color: var(--blue); }
    .mult-delta.gone { background: var(--amber-bg); color: var(--amber); }
    .group-item.is-new { box-shadow: inset 3px 0 0 var(--green); }
    .group-item.is-gone { opacity: .55; box-shadow: inset 3px 0 0 var(--amber); }
    .group-item.is-gone .group-name { text-decoration: line-through; }

    .empty { padding: 30px; text-align: center; color: var(--muted); font-size: 13px; }
    .column-error { color: var(--red); font-size: 12.5px; line-height: 1.5; padding: 12px 15px; overflow-wrap: anywhere; }

    /* ── Toasts ─────────────────────────────── */
    #toastWrap {
      position: fixed; top: 14px; right: 14px; z-index: 300;
      display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 28px));
      pointer-events: none;
    }
    .toast {
      pointer-events: auto; cursor: pointer;
      display: flex; align-items: flex-start; gap: 9px;
      padding: 11px 14px; border-radius: 11px; font-size: 13px; line-height: 1.5;
      background: var(--panel); border: 1px solid var(--line);
      box-shadow: 0 8px 28px -6px rgba(0, 0, 0, .22);
      opacity: 0; transform: translateX(16px);
      transition: opacity .18s ease, transform .18s ease;
      overflow-wrap: anywhere;
    }
    .toast.show { opacity: 1; transform: translateX(0); }
    .toast .t-icon { flex-shrink: 0; width: 18px; height: 18px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; margin-top: 1px; }
    .toast.toast-success .t-icon { background: var(--green-bg); color: var(--green); }
    .toast.toast-error .t-icon { background: var(--red-bg); color: var(--red); }
    .toast.toast-info .t-icon { background: var(--blue-bg); color: var(--blue); }

    /* ── Modal ──────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(9, 12, 18, .5);
      backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px);
      display: none; align-items: center; justify-content: center; z-index: 200; padding: 20px;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: var(--panel); border: 1px solid var(--line); border-radius: 16px;
      width: 100%; max-width: 580px; max-height: 85vh; overflow: auto;
      box-shadow: 0 20px 60px -10px rgba(0, 0, 0, .4);
      animation: dropIn .18s ease;
    }
    .modal-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 15px 20px; border-bottom: 1px solid var(--line);
      position: sticky; top: 0; background: var(--panel); z-index: 1;
    }
    .modal-title { font-size: 16px; font-weight: 750; }
    .modal-close { background: transparent; border: 0; font-size: 22px; line-height: 1; padding: 0 4px; color: var(--muted); }
    .modal-close:hover { background: transparent; color: var(--text); }
    .modal-body { padding: 18px 20px 20px; }
    .form-row { display: flex; flex-direction: column; gap: 4px; margin-bottom: 13px; }
    .form-row label { font-size: 12.5px; font-weight: 650; color: var(--muted); }
    .form-row input, .form-row select { width: 100%; }
    .form-hint { font-size: 12px; color: var(--muted); }
    .form-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }
    .form-error {
      display: none; margin-top: 4px; padding: 10px 12px; border-radius: var(--radius-sm);
      background: var(--red-bg); color: var(--red); font-size: 13px; line-height: 1.45; overflow-wrap: anywhere;
    }
    .form-error.show { display: block; }
    .login-confirm {
      margin-top: 8px; padding: 12px; border-radius: var(--radius-sm);
      background: var(--amber-bg); border: 1px solid color-mix(in srgb, var(--amber) 35%, var(--line)); text-align: center;
    }
    .login-confirm-text { margin-bottom: 10px; font-size: 13px; line-height: 1.5; }
    .login-confirm button { width: 100%; }
    .site-list { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
    .site-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2);
    }
    .site-row-info { flex: 1 1 auto; min-width: 0; }
    .site-row-name { font-weight: 700; font-size: 13.5px; overflow-wrap: anywhere; }
    .site-row-meta { color: var(--muted); font-size: 12px; margin-top: 2px; overflow-wrap: anywhere; }
    .site-row-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .site-row-actions button { padding: 0 10px; height: 29px; font-size: 12.5px; }
    .btn-danger { color: var(--red); border-color: color-mix(in srgb, var(--red) 45%, var(--line)); }
    .btn-danger:hover:not(:disabled) { background: var(--red-bg); border-color: var(--red); color: var(--red); }
    .modal-section-title { font-size: 14px; font-weight: 700; margin: 0 0 12px; padding-top: 15px; border-top: 1px solid var(--line); }

    @media (max-width: 860px) {
      header { padding: 12px 16px 10px; }
      .topbar { align-items: flex-start; flex-direction: column; }
      .actions { justify-content: flex-start; }
      main { padding: 12px 14px 18px; }
      .toolbar { grid-template-columns: 1fr auto; }
      #updated { font-size: 12px; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes refreshBar { from { background-position: 180% 0; } to { background-position: -180% 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes dropIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body>
  <header>
    <div class="topbar">
      <div>
        <div class="brand">
          <span class="logo">¥</span>
          <h1>relay2rate</h1>
          <span class="tag">倍率看板</span>
        </div>
        <div class="meta" id="updated"></div>
      </div>
      <div class="actions">
        <button class="primary" id="refreshAll">刷新全部</button>
        <select id="autoRefresh" title="自动刷新间隔">
          <option value="0">手动刷新</option>
          <option value="300000">每 5 分钟</option>
          <option value="900000">每 15 分钟</option>
          <option value="1800000">每 30 分钟</option>
        </select>
        <button id="manageSites">管理平台</button>
        <button id="themeToggle" class="icon-btn" title="切换主题" aria-label="切换主题">🌙</button>
      </div>
    </div>
  </header>
  <main>
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜索分组名称或备注">
      <select id="sort">
        <option value="multiplier">倍率从低到高</option>
        <option value="name">按分组排序</option>
        <option value="concurrency">并发从高到低</option>
      </select>
      <div class="summary" id="summary"></div>
    </div>
    <div class="login-bar" id="loginBar"></div>
    <div class="channel-bar" id="channelBar"></div>
    <div id="content"></div>
  </main>
  <div id="toastWrap" aria-live="polite"></div>
  <div class="modal-overlay" id="manageModal">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">管理平台</div>
        <button class="modal-close" id="modalClose" aria-label="关闭">×</button>
      </div>
      <div class="modal-body">
        <div class="site-list" id="siteList"></div>
        <div class="modal-section-title" id="formTitle">添加平台</div>
        <div class="form-row">
          <label for="f-name">平台名称 *</label>
          <input id="f-name" type="text" placeholder="平台名称">
        </div>
        <div class="form-row">
          <label for="f-baseUrl">站点地址 *</label>
          <input id="f-baseUrl" type="url" placeholder="https://example.com">
        </div>
        <div class="form-row">
          <label for="f-framework">框架 *</label>
          <select id="f-framework">
            <option value="" disabled selected>请选择框架</option>
            <option value="newapi">newapi</option>
            <option value="sub2api">sub2api</option>
          </select>
        </div>
        <div class="form-row">
          <label for="f-username">账号 / 邮箱</label>
          <input id="f-username" type="text" placeholder="登录用户名或邮箱">
        </div>
        <div class="form-row">
          <label for="f-password">密码</label>
          <input id="f-password" type="password" placeholder="登录密码">
          <span class="form-hint" id="passwordHint"></span>
        </div>
        <div class="form-row">
          <label for="f-token">Token（sub2api 可选）</label>
          <input id="f-token" type="password" placeholder="已有的 access token">
          <span class="form-hint" id="tokenHint"></span>
        </div>
        <input type="hidden" id="f-siteId">
        <div class="login-confirm" id="loginConfirm" style="display:none;">
          <div class="login-confirm-text" id="loginConfirmText"></div>
          <button class="primary" id="loginConfirmBtn">我已完成登录</button>
        </div>
        <div class="form-error" id="formError"></div>
        <div class="form-actions">
          <button id="formCancel">取消</button>
          <button class="primary" id="formSave">保存并验证</button>
        </div>
      </div>
    </div>
  </div>
  <script>
    const embeddedData = {};
    let data = embeddedData;
    let autoTimer = null;

    // ── 刷新状态：per-site，每个站点互不影响 ────────────────
    // refreshingSites: siteId -> { startedAt, timer, promise }
    const refreshingSites = new Map();
    // refreshAllState: { total, done } | null —— 仅控制“刷新全部”按钮自身
    let refreshAllState = null;
    let formBusy = false;
    let loginPollTimer = null;

    const els = {
      updated: document.getElementById("updated"),
      refreshAll: document.getElementById("refreshAll"),
      autoRefresh: document.getElementById("autoRefresh"),
      search: document.getElementById("search"),
      sort: document.getElementById("sort"),
      summary: document.getElementById("summary"),
      content: document.getElementById("content"),
      channelBar: document.getElementById("channelBar"),
      loginBar: document.getElementById("loginBar")
    };

    // ── 主题 ─────────────────────────────────
    const themeToggle = document.getElementById("themeToggle");
    function applyTheme(theme) {
      if (theme === "auto") document.documentElement.removeAttribute("data-theme");
      else document.documentElement.setAttribute("data-theme", theme);
      try { localStorage.setItem("theme", theme); } catch {}
      updateThemeIcon();
    }
    function currentResolvedTheme() {
      const explicit = document.documentElement.getAttribute("data-theme");
      if (explicit === "dark" || explicit === "light") return explicit;
      return window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    }
    function updateThemeIcon() {
      themeToggle.textContent = currentResolvedTheme() === "dark" ? "☀️" : "🌙";
    }
    (function initTheme() {
      let saved = "auto";
      try { saved = localStorage.getItem("theme") || "auto"; } catch {}
      applyTheme(saved);
      window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", updateThemeIcon);
    })();
    themeToggle.addEventListener("click", () => {
      applyTheme(currentResolvedTheme() === "dark" ? "light" : "dark");
    });

    // ── Toast ────────────────────────────────
    const TOAST_ICONS = { success: "✓", error: "✕", info: "i" };
    function toast(message, kind = "info", durationMs = 4000) {
      const box = document.getElementById("toastWrap");
      while (box.children.length >= 4) box.firstElementChild.remove();
      const el = document.createElement("div");
      el.className = "toast toast-" + kind;
      el.innerHTML = '<span class="t-icon">' + (TOAST_ICONS[kind] || "i") + '</span><span></span>';
      el.lastElementChild.textContent = message;
      box.appendChild(el);
      requestAnimationFrame(() => el.classList.add("show"));
      const dismiss = () => {
        el.classList.remove("show");
        setTimeout(() => el.remove(), 200);
      };
      el.addEventListener("click", dismiss);
      setTimeout(dismiss, durationMs);
    }

    // ── 数据加载 ─────────────────────────────
    async function loadData() {
      try {
        const res = await fetch("/api/data", { cache: "no-store" });
        if (res.ok) data = normalizePayload(await res.json());
      } catch {
        data = normalizePayload(data);
      }
      render();
    }

    function normalizePayload(input) {
      if (input && Array.isArray(input.sites)) return input;
      if (input && Array.isArray(input.groups)) {
        return {
          provider: "All",
          siteId: "all",
          scrapedAt: input.scrapedAt,
          sites: [{
            provider: input.provider,
            siteId: input.siteId,
            framework: input.framework,
            sourceUrl: input.sourceUrl,
            scrapedAt: input.scrapedAt,
            groups: input.groups
          }],
          groups: input.groups.map(group => ({ ...group, provider: input.provider, siteId: input.siteId, framework: input.framework, sourceUrl: input.sourceUrl, scrapedAt: input.scrapedAt }))
        };
      }
      return { sites: [], groups: [], scrapedAt: new Date().toISOString() };
    }

    function aggregateGroupsFromSites(sites) {
      return sites.flatMap(site => (site.groups || []).map(group => ({ ...group, provider: site.provider, siteId: site.siteId, framework: site.framework, sourceUrl: site.sourceUrl, scrapedAt: site.scrapedAt })));
    }

    // ── per-site 异步刷新核心 ─────────────────
    function refresh(siteId) {
      if (siteId === "all") { refreshAll(); return; }
      kickSiteRefresh(siteId);
    }

    function kickSiteRefresh(siteId) {
      const existing = refreshingSites.get(siteId);
      if (existing) return existing.promise;

      const state = { startedAt: Date.now(), timer: null };
      state.promise = (async () => {
        const name = getSiteLabel(siteId);
        try {
        const body = await requestRefresh(siteId);
        const refreshedPayload = body?.data ? normalizePayload(body.data) : null;
        if (!refreshedPayload) throw new Error("刷新失败");
          applyRefreshedSite(siteId, refreshedPayload);
          const site = (refreshedPayload.sites || []).find(s => s.siteId === siteId);
          const elapsed = elapsedSeconds(state.startedAt);
          toast(name + " 刷新完成 · 分组 " + ((site?.groups || []).length) + " 个 · " + elapsed + " 秒", "success");
          return { ok: true };
        } catch (error) {
          if (error.payload) {
            try { applyRefreshedSite(siteId, error.payload); } catch {}
          } else {
            await loadData();
          }
          toast(name + " 刷新失败：" + (error.message || String(error)), "error", 6000);
          return { ok: false, error };
        } finally {
          clearInterval(state.timer);
          refreshingSites.delete(siteId);
          updateCard(siteId);
          syncGlobalUi();
          syncLoginPoll();
        }
      })();

      refreshingSites.set(siteId, state);
      updateCard(siteId);
      state.timer = setInterval(() => updateCardTick(siteId), 1000);
      syncGlobalUi();
      syncLoginPoll();
      return state.promise;
    }

    async function requestRefresh(siteId) {
      const res = await fetch("/api/refresh?site=" + encodeURIComponent(siteId), { method: "POST" });
      let body = null;
      try { body = await res.json(); } catch { throw new Error("刷新失败"); }
      const refreshedPayload = body?.data ? normalizePayload(body.data) : null;
      if (!res.ok || !body.ok) {
        const error = new Error(body?.error || "刷新失败");
        error.payload = refreshedPayload;
        throw error;
      }
      return body;
    }

    function elapsedSeconds(startedAt) {
      return Math.max(1, Math.round((Date.now() - startedAt) / 1000));
    }

    // 将单个站点的刷新结果合并进 data，只更新对应卡片
    function applyRefreshedSite(siteId, refreshedPayload) {
      const updated = (refreshedPayload.sites || []).find(site => site.siteId === siteId);
      const current = normalizePayload(data);
      if (!updated) {
        data = refreshedPayload;
        render();
        return;
      }
      const currentSites = current.sites || [];
      const hasSite = currentSites.some(site => site.siteId === siteId);
      const sites = hasSite
        ? currentSites.map(site => site.siteId === siteId ? updated : site)
        : [...currentSites, updated];
      data = { ...current, scrapedAt: refreshedPayload.scrapedAt || current.scrapedAt, sites, groups: aggregateGroupsFromSites(sites) };
      updateCard(siteId);
      syncHeaderMeta();
    }

    // 刷新全部：逐个站点跑，但不阻塞其他站点按钮；
    // 已在刷新中的站点直接等它完成，不重复刷新。
    async function refreshAll() {
      if (refreshAllState) return;
      const siteIds = await getRefreshSiteIds();
      if (!siteIds.length) { toast("暂无可刷新的平台", "error"); return; }

      refreshAllState = { total: siteIds.length, done: 0 };
      syncGlobalUi();
      const startedAt = Date.now();
      let failures = 0;

      for (const siteId of siteIds) {
        const result = await kickSiteRefresh(siteId);
        if (!result.ok) failures++;
        refreshAllState.done++;
        syncGlobalUi();
      }

      refreshAllState = null;
      syncGlobalUi();
      const elapsed = Math.max(1, Math.round((Date.now() - startedAt) / 1000));
      const total = siteIds.length;
      if (failures) {
        toast("全部刷新结束：成功 " + (total - failures) + "/" + total + " · 用时 " + elapsed + " 秒", "error", 6500);
      } else {
        const normalized = normalizePayload(data);
        toast("已刷新全部 " + total + " 个平台 · 分组 " + (normalized.groups || []).length + " 个 · 用时 " + elapsed + " 秒", "success", 5200);
      }
    }

    async function getRefreshSiteIds() {
      const currentSites = sortSitesByOrder(normalizePayload(data).sites || []);
      if (currentSites.length) return [...new Set(currentSites.map(site => site.siteId).filter(Boolean))];
      try {
        const res = await fetch("/api/config", { cache: "no-store" });
        const body = await res.json();
        if (body.ok && Array.isArray(body.sites)) return [...new Set(sortSitesByOrder(body.sites).map(site => site.siteId).filter(Boolean))];
      } catch {}
      return [];
    }

    // ── 渲染 ─────────────────────────────────
    function hueFor(str) {
      let h = 0;
      for (const c of String(str)) h = (h * 31 + c.charCodeAt(0)) % 360;
      return h;
    }

    function currentCtx() {
      const query = els.search.value.trim().toLowerCase();
      const sort = els.sort.value;
      const allGroups = normalizePayload(data).groups || [];
      const allMults = allGroups.map(g => Number(g.multiplier)).filter(Number.isFinite);
      const best = allMults.length ? Math.min(...allMults) : Infinity;
      return { query, sort, best };
    }

    function sortGroupsOf(arr, sort) {
      return arr.slice().sort((a, b) => {
        if (sort === "name") return String(a.name).localeCompare(String(b.name), "zh-CN");
        if (sort === "concurrency") return (Number(b.concurrency) || 0) - (Number(a.concurrency) || 0);
        return Number(a.multiplier || 0) - Number(b.multiplier || 0);
      });
    }

    function matchGroupOf(group, query) {
      if (!query) return true;
      const haystack = [group.name, group.description].filter(Boolean).join(" ").toLowerCase();
      return haystack.includes(query);
    }

    function render() {
      data = normalizePayload(data);
      const hidden = getHiddenSites();
      const allSites = sortSitesByOrder(data.sites || []);
      const sites = allSites.filter(s => !hidden.has(s.siteId));
      const ctx = currentCtx();

      els.summary.textContent = "显示 " + countShown(sites, ctx) + " / " + (data.groups || []).filter(g => !hidden.has(g.siteId)).length;
      renderChannelBar(allSites, hidden);
      syncHeaderMeta();

      if (!sites.length || !countShown(sites, ctx)) {
        els.content.innerHTML = '<div class="empty">没有可显示的分组</div>';
        return;
      }
      els.content.innerHTML = '<div class="columns">' + sites.map(site => renderColumnHTML(site, ctx)).join("") + '</div>';
    }

    function countShown(sites, ctx) {
      let n = 0;
      for (const site of sites) n += (site.groups || []).filter(g => matchGroupOf(g, ctx.query)).length;
      return n;
    }

    function renderChannelBar(allSites, hidden) {
      if (!allSites.length) { els.channelBar.innerHTML = ""; return; }
      els.channelBar.innerHTML = allSites.map(site => {
        const visible = !hidden.has(site.siteId);
        return '<label class="channel-chip' + (visible ? " active" : "") + '" draggable="true" style="--h:' + hueFor(site.siteId) + '" data-channel="' + escapeHtml(site.siteId) + '">' +
          '<span class="dot"></span>' +
          '<input type="checkbox" data-channel="' + escapeHtml(site.siteId) + '"' + (visible ? " checked" : "") + '>' +
          escapeHtml(site.name || site.siteId) +
          '</label>';
      }).join("");
    }

    function renderColumnHTML(site, ctx) {
      const query = ctx.query, sort = ctx.sort, best = ctx.best;
      const groups = sortGroupsOf((site.groups || []).filter(g => matchGroupOf(g, query)), sort);
      const disappeared = (site.disappearedGroups || []).filter(g => matchGroupOf(g, query));
      const isRefreshing = refreshingSites.has(site.siteId);
      const state = refreshingSites.get(site.siteId);
      const ok = !site.error;

      const pill = isRefreshing
        ? '<span class="pill busy">刷新中</span>'
        : '<span class="pill' + (ok ? "" : " error") + '">' + (ok ? "正常" : "失败") + "</span>";
      const refreshBtn = isRefreshing
        ? '<button class="column-refresh is-loading" data-refresh="' + escapeHtml(site.siteId) + '" disabled title="正在刷新"><span data-elapsed>' + elapsedSeconds(state.startedAt) + "s</span></button>"
        : '<button class="column-refresh" data-refresh="' + escapeHtml(site.siteId) + '" title="刷新该平台">刷新</button>';

      const elapsedHtml = isRefreshing ? '<span class="elapsed" data-elapsed-stats>刷新 ' + elapsedSeconds(state.startedAt) + "s</span>" : "";
      const head = '<div class="topline"></div><div class="column-head" style="--h:' + hueFor(site.siteId) + '">' +
        '<div class="column-title" style="--h:' + hueFor(site.siteId) + '"><span class="dot"></span>' +
        '<div class="column-name">' + escapeHtml(site.provider || site.siteId) + "</div>" + pill + refreshBtn + "</div>" +
        '<div class="column-sub" title="' + escapeHtml(site.sourceUrl || "") + '">' + escapeHtml(site.sourceUrl || site.siteId) + "</div>" +
        '<div class="column-stats"><span>分组 ' + groups.length + " 个</span><span>" + escapeHtml(site.framework || "-") + "</span>" +
        formatBalance(site.balance) + '<span title="最后采集：' + escapeHtml(formatDate(site.scrapedAt)) + '">' + formatRelative(site.scrapedAt) + "</span>" + elapsedHtml + "</div></div>";

      const cls = "column" + (isRefreshing ? " is-refreshing" : "") + '" data-site="' + escapeHtml(site.siteId);

      if (site.error && !groups.length && !disappeared.length) {
        return '<div class="' + cls + '">' + head + '<div class="column-error">' + escapeHtml(site.error) + "</div></div>";
      }
      if (!groups.length && !disappeared.length) {
        return '<div class="' + cls + '">' + head + '<div class="empty">无匹配分组</div></div>';
      }

      const list = '<div class="group-list">' + groups.map(group => renderGroupItem(group, best)).join("") +
        disappeared.map(renderGoneItem).join("") + "</div>";
      return '<div class="' + cls + '">' + head + list + "</div>";
    }

    function multTier(multiplier, best) {
      if (multiplier === best) return "multiplier best";
      if (multiplier >= 2) return "multiplier high";
      if (multiplier >= 1) return "multiplier warn";
      return "multiplier";
    }

    function renderGroupItem(group, best) {
      const multiplier = Number(group.multiplier);
      const isNew = !!group.isNew;
      const prev = group.prevMultiplier;
      let deltaHtml = "";
      if (isNew) {
        deltaHtml = '<span class="mult-delta new-group">NEW</span>';
      } else if (prev !== undefined && Number.isFinite(Number(prev)) && Number(prev) !== multiplier) {
        const diff = multiplier - Number(prev);
        const sign = diff > 0 ? "+" : "";
        const cls = diff > 0 ? "up" : "down";
        const arrow = diff > 0 ? "↑" : "↓";
        deltaHtml = '<span class="mult-delta ' + cls + '" title="上次 ' + escapeHtml(String(prev)) + 'x">' + arrow + sign + diff.toFixed(2).replace(/\.?0+$/, "") + "</span>";
      }
      return '<div class="group-item' + (isNew ? " is-new" : "") + '">' +
        '<div class="group-info"><div class="group-name">' + escapeHtml(group.name) + "</div>" +
        (group.description ? '<div class="desc">' + escapeHtml(group.description) + "</div>" : "") + "</div>" +
        '<div class="group-side"><span class="mult-wrap"><span class="' + multTier(multiplier, best) + '">' + escapeHtml(String(group.multiplier)) + "x</span>" + deltaHtml + "</span>" +
        (group.concurrency != null ? '<span class="group-conc">并发 ' + escapeHtml(String(group.concurrency)) + "</span>" : "") + "</div>" +
        "</div>";
    }

    function renderGoneItem(g) {
      return '<div class="group-item is-gone">' +
        '<div class="group-info"><div class="group-name">' + escapeHtml(g.name) + "</div>" +
        (g.description ? '<div class="desc">' + escapeHtml(g.description) + "</div>" : "") + "</div>" +
        '<div class="group-side"><span class="mult-wrap"><span class="multiplier">' + escapeHtml(String(g.multiplier)) + 'x</span>' +
        '<span class="mult-delta gone">✕ 消失</span></span></div>' +
        "</div>";
    }

    // 只重建单个站点卡片（保持滚动与其他卡片不动）
    function updateCard(siteId) {
      const old = els.content.querySelector('.column[data-site="' + cssEscape(siteId) + '"]');
      if (!old) return;
      const site = (normalizePayload(data).sites || []).find(s => s.siteId === siteId);
      if (!site) return;
      const tpl = document.createElement("template");
      tpl.innerHTML = renderColumnHTML(site, currentCtx()).trim();
      old.replaceWith(tpl.content.firstElementChild);
    }

    // 轻量 tick：只更新耗时数字，不动其他 DOM
    function updateCardTick(siteId) {
      const state = refreshingSites.get(siteId);
      const card = els.content.querySelector('.column[data-site="' + cssEscape(siteId) + '"]');
      if (!state || !card) return;
      const s = elapsedSeconds(state.startedAt);
      const btnElapsed = card.querySelector("[data-elapsed]");
      if (btnElapsed) btnElapsed.textContent = s + "s";
      const statElapsed = card.querySelector("[data-elapsed-stats]");
      if (statElapsed) statElapsed.textContent = "刷新 " + s + "s";
    }

    function cssEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value).replace(/["\\\]]/g, "\\$&");
    }

    // ── 全局 UI 同步（不阻塞、仅提示） ─────────
    function syncGlobalUi() {
      const running = refreshingSites.size;
      if (refreshAllState) {
        els.refreshAll.disabled = true;
        els.refreshAll.classList.add("is-loading");
        els.refreshAll.textContent = "刷新中 " + refreshAllState.done + "/" + refreshAllState.total;
      } else {
        els.refreshAll.disabled = false;
        els.refreshAll.classList.toggle("is-loading", running > 0);
        els.refreshAll.textContent = running > 0 ? "刷新全部（" + running + " 进行中）" : "刷新全部";
      }
      syncHeaderMeta();
    }

    function syncHeaderMeta() {
      const normalized = normalizePayload(data);
      const running = refreshingSites.size;
      els.updated.innerHTML =
        "最后聚合 " + escapeHtml(formatRelative(normalized.scrapedAt)) + " · 平台 " + (normalized.sites || []).length + " 个 · 分组 " + (normalized.groups || []).length + " 个" +
        (running ? '&nbsp;<span class="running">' + running + " 个站点刷新中</span>" : "");
    }

    function getSiteLabel(siteId, payload = data) {
      const site = (normalizePayload(payload).sites || []).find(s => s.siteId === siteId);
      return site?.provider || site?.name || siteId;
    }

    // ── 格式化 ───────────────────────────────
    function formatDate(value) {
      if (!value) return "-";
      const time = new Date(value);
      if (Number.isNaN(time.getTime())) return "-";
      return time.toLocaleString();
    }

    function formatRelative(value) {
      if (!value) return "-";
      const time = new Date(value);
      if (Number.isNaN(time.getTime())) return "-";
      const diff = Date.now() - time.getTime();
      if (diff < 45_000) return "刚刚";
      if (diff < 3600_000) return Math.max(1, Math.round(diff / 60000)) + " 分钟前";
      if (diff < 86400_000) return Math.round(diff / 3600_000) + " 小时前";
      return time.toLocaleDateString() + " " + time.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    }

    function formatBalance(balance) {
      if (!balance) return "";
      let amount = null;
      if (balance.currency === "USD") amount = balance.balance;
      else if (balance.currency === "quota") amount = balance.quota != null ? balance.quota / 500000 : null;
      if (amount == null) return "";
      const cls = amount <= 0 ? "none" : amount < 1 ? "low" : "";
      return '<span class="balance' + (cls ? " " + cls : "") + '">$' + amount.toFixed(2) + "</span>";
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
    }

    // ── 渠道排序 / 显隐 ──────────────────────
    function getHiddenSites() {
      try { return new Set(JSON.parse(localStorage.getItem("hiddenSites") || "[]")); } catch { return new Set(); }
    }
    function setHiddenSites(set) {
      localStorage.setItem("hiddenSites", JSON.stringify([...set]));
    }
    function getChannelOrder() {
      try { return JSON.parse(localStorage.getItem("channelOrder") || "[]"); } catch { return []; }
    }
    function setChannelOrder(order) {
      localStorage.setItem("channelOrder", JSON.stringify(order));
    }
    function sortSitesByOrder(sites) {
      const order = getChannelOrder();
      if (!order.length) return sites;
      const indexById = new Map(order.map((id, i) => [id, i]));
      return sites.slice().sort((a, b) => {
        const ia = indexById.has(a.siteId) ? indexById.get(a.siteId) : order.length;
        const ib = indexById.has(b.siteId) ? indexById.get(b.siteId) : order.length;
        if (ia !== ib) return ia - ib;
        return String(a.name || a.siteId).localeCompare(String(b.name || b.siteId), "zh-CN");
      });
    }

    let dragSourceId = null;
    els.channelBar.addEventListener("dragstart", (event) => {
      const chip = event.target.closest(".channel-chip");
      if (!chip) return;
      dragSourceId = chip.getAttribute("data-channel");
      chip.classList.add("dragging");
      event.dataTransfer.effectAllowed = "move";
      if (event.dataTransfer.setData) event.dataTransfer.setData("text/plain", dragSourceId);
    });
    els.channelBar.addEventListener("dragend", (event) => {
      const chip = event.target.closest(".channel-chip");
      if (chip) chip.classList.remove("dragging");
      dragSourceId = null;
    });
    els.channelBar.addEventListener("dragover", (event) => {
      const chip = event.target.closest(".channel-chip");
      if (!chip) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
    });
    els.channelBar.addEventListener("drop", (event) => {
      const chip = event.target.closest(".channel-chip");
      if (!chip || !dragSourceId) return;
      event.preventDefault();
      const targetId = chip.getAttribute("data-channel");
      if (targetId === dragSourceId) return;
      const order = getChannelOrder();
      const allIds = (data.sites || []).map(s => s.siteId);
      const fullOrder = order.filter(id => allIds.includes(id));
      allIds.forEach(id => { if (!fullOrder.includes(id)) fullOrder.push(id); });
      const fromIdx = fullOrder.indexOf(dragSourceId);
      const toIdx = fullOrder.indexOf(targetId);
      if (fromIdx === -1 || toIdx === -1) return;
      fullOrder.splice(fromIdx, 1);
      fullOrder.splice(toIdx, 0, dragSourceId);
      setChannelOrder(fullOrder);
      render();
    });
    els.channelBar.addEventListener("change", (event) => {
      const siteId = event.target.getAttribute("data-channel");
      if (!siteId) return;
      const hidden = getHiddenSites();
      if (event.target.checked) hidden.delete(siteId);
      else hidden.add(siteId);
      setHiddenSites(hidden);
      render();
    });

    // ── 登录确认（per-site 芯片，可多站点并行） ─
    function syncLoginPoll() {
      const active = refreshingSites.size > 0 || formBusy;
      if (active && !loginPollTimer) {
        pollLogin();
        loginPollTimer = setInterval(pollLogin, 1500);
      } else if (!active && loginPollTimer) {
        clearInterval(loginPollTimer);
        loginPollTimer = null;
        renderLoginPendings([]);
      }
    }

    async function pollLogin() {
      try {
        const res = await fetch("/api/login/pending", { cache: "no-store" });
        const body = await res.json();
        const pendings = Array.isArray(body.pendings)
          ? body.pendings
          : body.pending ? [{ siteId: body.siteId, siteName: body.siteName }] : [];
        renderLoginPendings(pendings);
      } catch {}
    }

    function renderLoginPendings(pendings) {
      const modalOpen = modal.overlay.classList.contains("open");
      if (modalOpen) {
        els.loginBar.classList.remove("show");
        els.loginBar.innerHTML = "";
        const first = pendings[0];
        if (first) {
          modal.loginConfirmText.textContent = "请在弹出的浏览器中完成「" + (first.siteName || first.siteId) + "」的登录验证，完成后点击下方按钮。";
          modal.loginConfirm.dataset.site = first.siteId || "";
          modal.loginConfirm.style.display = "block";
        } else {
          modal.loginConfirm.style.display = "none";
        }
        return;
      }
      modal.loginConfirm.style.display = "none";
      if (!pendings.length) {
        els.loginBar.classList.remove("show");
        els.loginBar.innerHTML = "";
        return;
      }
      els.loginBar.innerHTML = pendings.map(p =>
        '<div class="login-chip" data-site="' + escapeHtml(p.siteId || "") + '">' +
        '<div class="login-chip-text">请在弹出的浏览器中完成「' + escapeHtml(p.siteName || p.siteId) + "」的登录验证，完成后点击右侧按钮。</div>" +
        '<button class="primary" data-confirm-login="' + escapeHtml(p.siteId || "") + '">我已完成登录</button>' +
        "</div>"
      ).join("");
      els.loginBar.classList.add("show");
    }

    async function confirmLogin(siteId, button) {
      if (button) button.disabled = true;
      try {
        await fetch("/api/login/confirm" + (siteId ? "?site=" + encodeURIComponent(siteId) : ""), { method: "POST" });
      } catch {}
      if (button) button.disabled = false;
      pollLogin();
    }

    els.loginBar.addEventListener("click", (event) => {
      const siteId = event.target.getAttribute("data-confirm-login");
      if (siteId != null) confirmLogin(siteId || null, event.target);
    });

    // ── 站点管理 Modal ───────────────────────
    const modal = {
      overlay: document.getElementById("manageModal"),
      close: document.getElementById("modalClose"),
      siteList: document.getElementById("siteList"),
      formTitle: document.getElementById("formTitle"),
      fName: document.getElementById("f-name"),
      fBaseUrl: document.getElementById("f-baseUrl"),
      fFramework: document.getElementById("f-framework"),
      fUsername: document.getElementById("f-username"),
      fPassword: document.getElementById("f-password"),
      fToken: document.getElementById("f-token"),
      fSiteId: document.getElementById("f-siteId"),
      passwordHint: document.getElementById("passwordHint"),
      tokenHint: document.getElementById("tokenHint"),
      formError: document.getElementById("formError"),
      loginConfirm: document.getElementById("loginConfirm"),
      loginConfirmText: document.getElementById("loginConfirmText"),
      loginConfirmBtn: document.getElementById("loginConfirmBtn"),
      cancel: document.getElementById("formCancel"),
      save: document.getElementById("formSave"),
      manageBtn: document.getElementById("manageSites")
    };

    modal.loginConfirmBtn.addEventListener("click", () => confirmLogin(modal.loginConfirm.dataset.site || null, modal.loginConfirmBtn));

    function showFormError(message) {
      modal.formError.textContent = message;
      modal.formError.classList.add("show");
    }
    function clearFormError() {
      modal.formError.classList.remove("show");
      modal.formError.textContent = "";
    }

    function openModal() {
      modal.overlay.classList.add("open");
      loadSiteList();
      resetForm();
      pollLogin();
    }
    function closeModal() {
      modal.overlay.classList.remove("open");
      modal.loginConfirm.style.display = "none";
      modal.save.disabled = false;
      modal.save.textContent = "保存并验证";
      clearFormError();
      resetForm();
      pollLogin();
    }
    function resetForm() {
      modal.fSiteId.value = "";
      modal.formTitle.textContent = "添加平台";
      modal.fName.value = "";
      modal.fBaseUrl.value = "";
      modal.fFramework.value = "";
      modal.fUsername.value = "";
      modal.fPassword.value = "";
      modal.fToken.value = "";
      modal.passwordHint.textContent = "";
      modal.tokenHint.textContent = "";
      clearFormError();
    }
    function fillForm(site) {
      modal.fSiteId.value = site.siteId;
      modal.formTitle.textContent = "编辑平台：" + (site.name || site.siteId);
      modal.fName.value = site.name || "";
      modal.fBaseUrl.value = site.baseUrl || "";
      modal.fFramework.value = site.framework || "";
      modal.fUsername.value = site.username || "";
      modal.fPassword.value = "";
      modal.fToken.value = "";
      modal.passwordHint.textContent = site.password === "已配置" ? "已配置，留空则不修改" : "";
      modal.tokenHint.textContent = site.token === "已配置" ? "已配置，留空则不修改" : "";
    }

    async function loadSiteList() {
      try {
        const res = await fetch("/api/config", { cache: "no-store" });
        const body = await res.json();
        if (!body.ok) throw new Error(body.error || "加载失败");
        renderSiteList(body.sites || []);
      } catch (error) {
        modal.siteList.innerHTML = '<div class="site-row-meta">加载失败:' + escapeHtml(error.message) + "</div>";
      }
    }

    function renderSiteList(sites) {
      if (!sites.length) {
        modal.siteList.innerHTML = '<div class="site-row-meta">暂无平台，在下方添加</div>';
        return;
      }
      modal.siteList.innerHTML = sites.map(site => {
        const cred = [site.username, site.password, site.token].filter(v => v && v !== "已配置" && v !== "").length > 0 || site.password === "已配置" || site.token === "已配置";
        return '<div class="site-row"><div class="site-row-info">' +
          '<div class="site-row-name">' + escapeHtml(site.name || site.siteId) + "</div>" +
          '<div class="site-row-meta">' + escapeHtml(site.baseUrl || "") + " · " + escapeHtml(site.framework || "-") + (cred ? " · 凭证已配置" : " · 未配置凭证") + "</div>" +
          '</div><div class="site-row-actions">' +
          '<button data-edit="' + escapeHtml(site.siteId) + '">编辑</button>' +
          '<button class="btn-danger" data-delete="' + escapeHtml(site.siteId) + '">删除</button>' +
          "</div></div>";
      }).join("");
    }

    modal.siteList.addEventListener("click", async (event) => {
      const editId = event.target.getAttribute("data-edit");
      const deleteId = event.target.getAttribute("data-delete");
      if (editId) {
        try {
          const res = await fetch("/api/config", { cache: "no-store" });
          const body = await res.json();
          const site = (body.sites || []).find(s => s.siteId === editId);
          if (site) fillForm(site);
        } catch {}
      }
      if (deleteId) {
        if (!confirm("确认删除平台 " + deleteId + "？")) return;
        try {
          const res = await fetch("/api/config/site?site=" + encodeURIComponent(deleteId), { method: "DELETE" });
          const body = await res.json();
          if (!body.ok) throw new Error(body.error || "删除失败");
          await loadSiteList();
          await loadData();
          toast("已删除 " + deleteId, "success");
        } catch (error) {
          toast(error.message, "error");
        }
      }
    });

    modal.save.addEventListener("click", async () => {
      clearFormError();
      const payload = {
        siteId: modal.fSiteId.value || undefined,
        name: modal.fName.value.trim(),
        baseUrl: modal.fBaseUrl.value.trim(),
        framework: modal.fFramework.value,
        username: modal.fUsername.value.trim(),
        password: modal.fPassword.value,
        token: modal.fToken.value
      };
      modal.save.disabled = true;
      const originalText = modal.save.textContent;
      modal.save.textContent = "验证采集中...";
      formBusy = true;
      syncLoginPoll();
      try {
        const testRes = await fetch("/api/config/site/test", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const testBody = await testRes.json();
        if (!testBody.ok) throw new Error(testBody.error || "采集验证失败");

        modal.save.textContent = "保存中...";
        const res = await fetch("/api/config/site", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await res.json();
        if (!body.ok) throw new Error(body.error || "保存失败");

        resetForm();
        await loadSiteList();
        closeModal();
        const savedSiteId = body.siteId;
        if (savedSiteId) refresh(savedSiteId);
        else await loadData();
      } catch (error) {
        showFormError(error.message || String(error));
      } finally {
        formBusy = false;
        syncLoginPoll();
        modal.save.disabled = false;
        modal.save.textContent = originalText;
      }
    });

    modal.manageBtn.addEventListener("click", openModal);
    modal.close.addEventListener("click", closeModal);
    modal.cancel.addEventListener("click", closeModal);
    modal.overlay.addEventListener("click", (event) => {
      if (event.target === modal.overlay) closeModal();
    });

    // ── 事件绑定 ─────────────────────────────
    els.refreshAll.addEventListener("click", () => refresh("all"));
    els.autoRefresh.addEventListener("change", () => {
      if (autoTimer) clearInterval(autoTimer);
      const interval = Number(els.autoRefresh.value);
      if (interval > 0) autoTimer = setInterval(() => refresh("all"), interval);
    });
    els.search.addEventListener("input", render);
    els.sort.addEventListener("change", render);

    els.content.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-refresh]");
      const siteId = btn?.getAttribute("data-refresh");
      if (!siteId) return;
      if (refreshingSites.has(siteId)) return; // 点击的是“刷新中”按钮（已 disabled，兜底）
      refresh(siteId);
    });

    loadData();
  </script>
</body>
</html>
